apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: nairatransfer-pro-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: nairatransfer-pro # ← Targets my Deployment
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70 # Scale when CPU > 70%
